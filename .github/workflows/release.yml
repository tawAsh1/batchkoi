# Release: GoReleaser builds and publishes binaries when a v* tag is pushed.
#
# Security: actions pinned to full commit SHAs; contents:write is granted
# only to this job (needed to create the GitHub Release); checkout does not
# persist credentials — GoReleaser uses the explicitly-passed GITHUB_TOKEN.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # for build provenance attestation (Sigstore signing)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the changelog
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No cache in the release job: a poisoned cache entry could end up
          # inside published binaries (zizmor: cache-poisoning).
          cache: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signed build provenance for every released archive; users can verify
      # with: gh attestation verify <file> --repo tawAsh1/batchkoi
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
